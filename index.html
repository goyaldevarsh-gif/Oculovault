:root{
  --navy:#0F2942;--navy2:#17395A;--teal:#0D9488;--teal2:#0B7F76;--teal-d:#0A6B63;
  --mint:#CDEFEA;--mint2:#E6F7F5;--bg:#F8FAFC;--card:#FFFFFF;--line:#E3EAEE;
  --ink:#0F2942;--ink2:#41566A;--ink3:#64748B;--red:#D93030;--red-bg:#FDECEA;--amber:#B26A00;--amber-bg:#FFF4DD;--green:#117A4F;
  --sh:0 1px 2px rgba(10,37,64,.06),0 4px 14px rgba(10,37,64,.07);
  --sh2:0 8px 28px rgba(10,37,64,.16);
  --r:16px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E9EFF2;color:var(--ink);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}svg.i.xs{width:16px;height:16px}svg.i.lg{width:26px;height:26px}

#app{position:relative;max-width:560px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 60px rgba(10,37,64,.12)}
@media(min-width:900px){#app{max-width:640px}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);animation:fin .16s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.scroll.pb{padding-bottom:110px}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 10px) 12px 10px;background:var(--bg);min-height:56px;flex:none}
.top h1{flex:1;margin:0;font-size:18px;font-weight:700;text-align:center;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--navy);position:relative}
.ib:active{background:#E3EAEE}
.ib .dot{position:absolute;top:6px;right:5px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.ib.ph{width:auto;padding:0 12px;gap:6px;color:var(--teal2);font-weight:600;font-size:13px;display:flex}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;font-weight:700;font-size:15.5px;width:100%;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.pri{background:linear-gradient(180deg,#129A94,#0B7A7C);color:#fff;box-shadow:0 6px 16px rgba(15,139,135,.28)}
.btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.ghost{background:var(--mint2);color:var(--teal-d)}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.sm{height:40px;font-size:13.5px;border-radius:12px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;justify-content:space-between}
.sect{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sect h2{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.sect a,.sect button{color:var(--teal2);font-weight:700;font-size:13px;padding:10px 6px;margin:-10px -6px}
.eb{color:var(--teal2);font-weight:700;font-size:13px;text-transform:none;letter-spacing:0;padding:10px 8px;margin:-10px -8px}
.kv a{display:inline-block;padding:6px 0}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:all .1s}
.chip[aria-pressed=true],.chip.on{background:var(--mint);border-color:var(--teal);color:var(--teal-d)}
.chip[aria-pressed=true]::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--teal)}
.chips.seg{flex-wrap:nowrap}.chips.seg .chip{flex:1;justify-content:center;padding:0 6px}
.chips.seg .chip::before{display:none}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none;min-height:36px;font-size:13px;padding:0 13px}
.hscroll .chip::before{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:9px;background:var(--mint);color:var(--teal-d);font-weight:700;font-size:12px;white-space:nowrap}
.tag.navy{background:#E2EAF3;color:var(--navy2)}.tag.red{background:var(--red-bg);color:var(--red)}.tag.amber{background:var(--amber-bg);color:var(--amber)}.tag.grey{background:#EDF1F3;color:var(--ink2)}.tag.green{background:#E1F5EA;color:var(--green)}

/* forms */
.fld{margin-bottom:16px}
.fld>label,.lbl{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:7px}
.fld .req{color:var(--red)}
.inp{width:100%;height:50px;border:1.5px solid var(--line);border-radius:13px;background:#fff;padding:0 14px;font-size:16px;outline:none;transition:border .1s,box-shadow .1s}
.inp:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(15,139,135,.12)}
textarea.inp{height:auto;min-height:150px;padding:12px 14px;resize:vertical;line-height:1.5}
.inp.err{border-color:var(--red)}
.iwrap{position:relative}.iwrap>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.iwrap .inp{padding-left:44px}.iwrap .eye{position:absolute;right:4px;top:4px;width:42px;height:42px;display:grid;place-items:center;color:var(--ink3)}
.help{font-size:12.5px;color:var(--ink3);margin-top:6px}.help.err{color:var(--red);font-weight:600}
.help .lnk{color:var(--teal2);font-weight:700;text-decoration:underline}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.savebar{flex:none;padding:12px 16px calc(var(--sab) + 12px);background:linear-gradient(180deg,rgba(244,247,249,0),var(--bg) 30%);}

/* list rows */
.pt{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;text-align:left;width:100%}
.pt:active{background:#F8FBFB}
.av{width:46px;height:46px;border-radius:50%;background:var(--mint);color:var(--teal-d);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;overflow:hidden;background-size:cover;background-position:center}
.av.sq{border-radius:12px}
.pt .m{flex:1;min-width:0}
.pt .n{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .s{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pt .s b{color:var(--ink2);font-weight:600}
.pt .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.callb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--teal2);background:var(--mint2)}

.empty{text-align:center;padding:40px 24px;color:var(--ink3)}
.empty .ei{width:76px;height:76px;border-radius:24px;background:var(--mint2);color:var(--teal);display:grid;place-items:center;margin:0 auto 14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* search */
.search{position:relative;margin:2px 0 12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3)}

/* ---------- IndexedDB ---------- */
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{
    const q=indexedDB.open('oculovault',1);
    q.onupgradeneeded=e=>{const d=q.result;
      ['patients','cases','visits','reviews','media'].forEach(s=>{const st=d.createObjectStore(s,{keyPath:'id'});if(s!=='patients')st.createIndex('patientId','patientId')});
      d.createObjectStore('blobs',{keyPath:'id'});};
    q.onsuccess=()=>{DB.db=q.result;res()};q.onerror=()=>rej(q.error);
  })},
  tx(stores,mode='readonly'){return DB.db.transaction(stores,mode)},
  all(store){return new Promise((res,rej)=>{const r=DB.tx(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  get(store,id){return new Promise((res,rej)=>{const r=DB.tx(store).objectStore(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  put(store,obj){return new Promise((res,rej)=>{const t=DB.tx(store,'readwrite');t.objectStore(store).put(obj);t.oncomplete=()=>res(obj);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  del(store,id){return new Promise((res,rej)=>{const t=DB.tx(store,'readwrite');t.objectStore(store).delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
  clear(){return new Promise((res,rej)=>{const n=['patients','cases','visits','reviews','media','blobs'];const t=DB.tx(n,'readwrite');n.forEach(s=>t.objectStore(s).clear());t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
};

/* ---------- in-memory cache + data API ---------- */
const S={patients:[],cases:[],visits:[],reviews:[],media:[],urls:new Map(),settings:{},acct:null};
const TBL={patients:'patients',cases:'cases',visits:'visits',reviews:'reviews',media:'media'};
async function loadAll(){for(const k of Object.keys(TBL))S[k]=await DB.all(k)}
async function save(store,obj){await DB.put(store,obj);const a=S[store],i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj);return obj}
async function remove(store,id){await DB.del(store,id);S[store]=S[store].filter(x=>x.id!==id);if(store==='media'){await DB.del('blobs',id);const u=S.urls.get(id);if(u){URL.revokeObjectURL(u.t);u.f&&URL.revokeObjectURL(u.f);S.urls.delete(id)}}}
const byId=(store,id)=>S[store].find(x=>x.id===id);
const casesOf=pid=>S.cases.filter(c=>c.patientId===pid);
const visitsOf=pid=>S.visits.filter(v=>v.patientId===pid).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
const reviewsOf=pid=>S.reviews.filter(r=>r.patientId===pid);
const mediaOf=pid=>S.media.filter(m=>m.patientId===pid).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
const pendingReview=pid=>reviewsOf(pid).filter(r=>!r.done).sort((a,b)=>a.date.localeCompare(b.date))[0];
const patientMods=pid=>casesOf(pid).map(c=>c.module);
const _ymd=(b,n)=>{let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}return y<0?{y:0,m:0,d:0}:{y,m,d}};
/* age as years/months/days. DOB → exact. Typed age (ageY/ageM/ageD at ageAt) keeps ageing automatically. Legacy p.age = years only. */
const ageParts=p=>{
  const n=new Date();n.setHours(12,0,0,0);
  if(p.dob)return _ymd(new Date(p.dob+'T12:00:00'),n);
  if(p.ageAt&&(p.ageY!==''&&p.ageY!=null||p.ageM!==''&&p.ageM!=null||p.ageD!==''&&p.ageD!=null)){
    const b=new Date(p.ageAt+'T12:00:00');b.setFullYear(b.getFullYear()-(+p.ageY||0));b.setMonth(b.getMonth()-(+p.ageM||0));b.setDate(b.getDate()-(+p.ageD||0));return _ymd(b,n)}
  if(p.age!==''&&p.age!=null&&!isNaN(+p.age))return{y:+p.age,m:0,d:0};
  return null};
const ageOf=p=>{const a=ageParts(p);return a?a.y:null};
const ageStr=(p,compact)=>{const a=ageParts(p);if(!a)return '';const t=[];
  if(compact&&a.y>=5)return a.y+'y';
  if(a.y)t.push(a.y+(compact?'y':' y'));if(a.m||(a.y&&a.d))t.push(a.m+(compact?'m':' m'));if(a.d||!t.length)t.push(a.d+(compact?'d':' d'));
  return t.join(' ')};
const ageSex=p=>{const a=ageStr(p,true);const s=p.sex?p.sex[0]:'';return [a,s].filter(x=>x!=='').join(' · ')||'—'};
const dxText=c=>{if(!c||!c.diagnoses||!c.diagnoses.length)return '';const d=c.diagnoses.map(x=>x==='Other'&&c.otherDx?c.otherDx:x).join(', ');return d+(c.side?` (${c.side})`:'')};
const patientDx=pid=>casesOf(pid).map(dxText).filter(Boolean).join(' · ');
const reviewStatus=r=>r.done?'done':r.date<today()?'overdue':r.date===today()?'today':'upcoming';
const dueCount=()=>S.reviews.filter(r=>!r.done&&r.date<=today()).length;
function lastVisit(pid){const v=visitsOf(pid)[0];if(v)return v.date;const cs=casesOf(pid).sort((a,b)=>b.created-a.created)[0];return cs?cs.visitDate||isoDate(new Date(cs.created)):null}

/* ---------- media / blobs ---------- */
async function thumbUrl(id){let e=S.urls.get(id);if(e&&e.t)return e.t;const m=byId('media',id);if(!m)return '';e=e||{};e.t=URL.createObjectURL(m.thumb);S.urls.set(id,e);return e.t}
async function fullUrl(id){let e=S.urls.get(id);if(e&&e.f)return e.f;const b=await DB.get('blobs',id);if(!b)return thumbUrl(id);e=e||{};e.f=URL.createObjectURL(b.blob);S.urls.set(id,e);return e.f}
async function hydrateThumbs(root){for(const im of $$('img[data-mid]',root)){thumbUrl(im.dataset.mid).then(u=>{im.src=u})}for(const el of $$('[data-bgmid]',root)){thumbUrl(el.dataset.bgmid).then(u=>{el.style.backgroundImage=`url(${u})`;el.textContent=''})}}
function latestThumbId(pid,mod){const l=S.media.filter(x=>x.patientId===pid&&(!mod||x.module===mod)).sort((a,b)=>b.created-a.created);const m=l.find(x=>!['ct','mri','xray','hess'].includes(x.category))||l[0];return m&&m.id}
async function loadBitmap(file){
  if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){}}
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{res(im)};im.onerror=rej;im.src=u})
}
function renderScaled(src,max,q){
  const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight,k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',q));
}
async function processImage(file){
  const max=S.settings.quality==='high'?2600:1800;
  const bm=await loadBitmap(file);
  const full=await renderScaled(bm,max,.88),thumb=await renderScaled(bm,360,.8);
  bm.close&&bm.close();return{full,thumb};
}

/* ---------- zoomable image (pinch, wheel, double-tap, pan, swipe) ---------- */
function Zoomable(stage,img,{onSwipe}={}){
  const P=new Map();let k=1,tx=0,ty=0,w=0,h=0,sw=0,sh=0,last=0,pinch=null;
  const apply=()=>{const W=w*k,H=h*k;tx=W<=sw?(sw-W)/2:Math.min(0,Math.max(sw-W,tx));ty=H<=sh?(sh-H)/2:Math.min(0,Math.max(sh-H,ty));img.style.transform=`translate(${tx}px,${ty}px) scale(${k})`};
  const layout=()=>{sw=stage.clientWidth;sh=stage.clientHeight;const nw=img.naturalWidth||1,nh=img.naturalHeight||1,f=Math.min(sw/nw,sh/nh);w=nw*f;h=nh*f;img.style.width=w+'px';img.style.height=h+'px';k=1;apply()};
  const zoomAt=(px,py,nk)=>{nk=Math.min(6,Math.max(1,nk));tx=px-(px-tx)*(nk/k);ty=py-(py-ty)*(nk/k);k=nk;apply()};
  const rel=(x,y)=>{const r=stage.getBoundingClientRect();return[x-r.left,y-r.top]};
  img.addEventListener('load',layout);if(img.complete&&img.naturalWidth)layout();
  new ResizeObserver(layout).observe(stage);
  stage.addEventListener('pointerdown',e=>{if(e.target.closest('.nv'))return;stage.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:Date.now()});
    if(P.size===2){const[a,b]=[...P.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,k}}});
  stage.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;
    if(P.size===2&&pinch){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),[mx,my]=rel((a.x+b.x)/2,(a.y+b.y)/2);zoomAt(mx,my,pinch.k*d/pinch.d)}
    else if(P.size===1&&k>1){tx+=e.clientX-p.x;ty+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;apply()}
    else{p.x=e.clientX;p.y=e.clientY}});
  const up=e=>{const p=P.get(e.pointerId);if(!p)return;const single=P.size===1;P.delete(e.pointerId);if(P.size<2)pinch=null;P.forEach(q=>{q.x0=q.x;q.y0=q.y});
    if(!single)return;const dx=e.clientX-p.x0,dy=e.clientY-p.y0,dt=Date.now()-p.t;
    if(k===1&&onSwipe&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){onSwipe(dx<0?1:-1);return}
    if(Math.hypot(dx,dy)<10&&dt<350){const n=Date.now();if(n-last<320){const[px,py]=rel(e.clientX,e.clientY);k>1?(k=1,apply()):zoomAt(px,py,2.8);last=0}else last=n}};
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  stage.addEventListener('wheel',e=>{e.preventDefault();const[px,py]=rel(e.clientX,e.clientY);zoomAt(px,py,k*(e.deltaY<0?1.2:1/1.2))},{passive:false});
  return{reset:()=>{k=1;apply()},layout,get k(){return k}};
}

/* ---------- full-screen viewer ---------- */
function openViewer(ids,start,{onChange}={}){
  let list=[...ids],i=start,z;
  const ov=document.createElement('div');ov.className='vw';
  ov.innerHTML=`<div class="vt"><button class="ib" data-x aria-label="Close">${I('x')}</button><div class="c"></div><button class="ib" data-edit aria-label="Edit details">${I('edit')}</button><button class="ib" data-del aria-label="Delete">${I('trash')}</button></div>
  <div class="stage"><img alt="" draggable="false"><button class="nv l" data-n="-1" aria-label="Previous">${I('chl')}</button><button class="nv r" data-n="1" aria-label="Next">${I('chr')}</button></div><div class="cap"></div>`;
  document.body.appendChild(ov);
  const stage=$('.stage',ov),img=$('img',ov);
  z=Zoomable(stage,img,{onSwipe:d=>step(d)});
  async function show(){
    const id=list[i],m=byId('media',id);if(!m){close();return}
    $('.c',ov).textContent=`${i+1} / ${list.length}`;
    $('.nv.l',ov).style.display=i>0?'':'none';$('.nv.r',ov).style.display=i<list.length-1?'':'none';
    const p=byId('patients',m.patientId);
    $('.cap',ov).innerHTML=`<b>${esc(mediaLabel(m))} · ${fmtDate(m.date)}</b>${m.desc?`<div>${esc(m.desc)}</div>`:''}<span>${esc(p?p.name:'')}${m.module?' · '+esc(MODS[m.module]?.label||''):''}</span>`;
    img.style.visibility='hidden';img.src=await thumbUrl(id);
    const f=await fullUrl(id);if(list[i]===id){img.src=f;img.style.visibility='visible'}
  }
  const step=d=>{const n=i+d;if(n>=0&&n<list.length){i=n;show()}};
  const close=()=>{ov.remove();document.removeEventListener('keydown',key)};
  const key=e=>{if(e.key==='Escape')close();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)};
  document.addEventListener('keydown',key);
  ov.addEventListener('click',async e=>{
    if(e.target.closest('[data-x]'))return close();
    const n=e.target.closest('[data-n]');if(n)return step(+n.dataset.n);
    if(e.target.closest('[data-del]')){const m=byId('media',list[i]);
      if(await confirmBox({title:'Delete this image?',msg:'It will be permanently removed from this patient\'s record.',ok:'Delete',danger:true})){
        await remove('media',m.id);list.splice(i,1);toast('Image deleted');onChange&&onChange();if(!list.length)return close();if(i>=list.length)i=list.length-1;show()}}
    if(e.target.closest('[data-edit]')){editMediaSheet(list[i],()=>{show();onChange&&onChange()})}
  });
  show();
}

/* ---------- add-images flow (camera / gallery → details → save) ---------- */
function addImagesFlow({patientId,module,category,visitId,date,onDone}){
  const cs=casesOf(patientId);
  const src=openSheet({title:'Add images',body:`<div class="row2" style="margin-bottom:10px"><button class="btn ghost" data-src="cam" style="height:96px;flex-direction:column">${I('camera','lg')}Take photo</button><button class="btn ghost" data-src="gal" style="height:96px;flex-direction:column">${I('image','lg')}From gallery</button></div><p class="help" style="text-align:center">Camera or gallery · select many at once · CT / MRI / X-ray screenshots too</p>`});
  src.el.addEventListener('click',async e=>{const b=e.target.closest('[data-src]');if(!b)return;
    const files=await pickFiles({camera:b.dataset.src==='cam'});src.close();if(files.length)detailsSheet(files)});
  function detailsSheet(files){
    let mod=module||(cs[0]&&cs[0].module)||null,cat=category||null;
    const items=files.map(f=>({f,u:URL.createObjectURL(f),note:''}));
    const sh=openSheet({title:'Add images',body:`
      <div id="pl"></div>
      <div class="row2" style="margin-bottom:12px"><button class="btn sec sm" data-more="cam">${I('camera','sm')} Take another</button><button class="btn sec sm" data-more="gal">${I('image','sm')} Add from gallery</button></div>
      ${cs.length>1?`<div class="fld"><label>Specialty</label><div class="chips seg" id="am">${cs.map(c=>`<button class="chip" data-m="${c.module}" aria-pressed="${c.module===mod}">${MODS[c.module].label}</button>`).join('')}</div></div>`:''}
      <div class="fld"><label>Type <span class="req">*</span></label><div class="chips" id="ac"></div></div>
      <div class="fld"><label>Date</label><input type="date" class="inp" id="ad" value="${date||today()}" max="${today()}"></div>`,
      footer:`<button class="btn pri" id="asave"></button>`});
    const drawList=()=>{
      $('#pl',sh.el).innerHTML=items.map((it,i)=>`<div class="pi"><img src="${it.u}" alt=""><div style="flex:1;min-width:0"><textarea class="inp" rows="2" data-n="${i}" placeholder="Note for this photo (optional)">${esc(it.note)}</textarea></div><button class="ib" data-rm="${i}" aria-label="Remove photo">${I('x','sm')}</button></div>`).join('');
      $('#asave',sh.el).innerHTML=`${I('check','sm')} Save ${items.length} photo${items.length>1?'s':''}`;
    };
    const drawCats=()=>{const list=mod?MODS[mod].cats:CATORDER;if(cat&&!list.includes(cat))cat=null;$('#ac',sh.el).innerHTML=list.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===cat}">${CATS[c]}</button>`).join('')};
    drawList();drawCats();
    const cleanup=()=>items.forEach(it=>URL.revokeObjectURL(it.u));
    sh.el.addEventListener('input',e=>{const t=e.target.closest('[data-n]');if(t)items[+t.dataset.n].note=t.value});
    sh.el.addEventListener('click',async e=>{
      const mo=e.target.closest('[data-more]');
      if(mo){const fl=await pickFiles({camera:mo.dataset.more==='cam'});fl.forEach(f=>items.push({f,u:URL.createObjectURL(f),note:''}));if(fl.length){drawList();const l=$('#pl',sh.el);l.lastElementChild&&l.lastElementChild.scrollIntoView({block:'nearest'})}return}
      const rm=e.target.closest('[data-rm]');if(rm){const it=items.splice(+rm.dataset.rm,1)[0];URL.revokeObjectURL(it.u);if(!items.length){sh.close();return}drawList();return}
      const m=e.target.closest('[data-m]');if(m){mod=m.dataset.m;$$('#am .chip',sh.el).forEach(x=>x.setAttribute('aria-pressed',x===m));drawCats()}
      const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;$$('#ac .chip',sh.el).forEach(x=>x.setAttribute('aria-pressed',x===c))}
      if(e.target.closest('#asave')){
        if(!cat){toast('Pick a type first (Clinical, CT, MRI…)');return}
        const btn=e.target.closest('#asave');btn.disabled=true;let n=0;
        const d=$('#ad',sh.el).value||today();
        for(const it of items){btn.textContent=`Saving ${++n} / ${items.length}…`;
          try{const{full,thumb}=await processImage(it.f);const id=uid();
            await DB.put('blobs',{id,blob:full});await save('media',{id,patientId,module:mod,category:cat,date:d,desc:it.note.trim(),visitId:visitId||null,created:Date.now()+n,thumb,size:full.size});}
          catch(err){console.error(err);toast('Could not read one image')}}
        cleanup();sh.close();toast(`${items.length} photo${items.length>1?'s':''} saved`);onDone&&onDone();
      }});
  }
}

/* ---------- router ---------- */
const ROUTES={};let stack=[],replacing=false,curHash='';
function go(h,replace=false){const t='#'+h;if(location.hash===t){render();return}if(replace){replacing=true;location.replace(t)}else location.hash=t}
function back(fallback='/home'){if(stack.length>1)history.back();else go(fallback,true)}
function onHash(){
  if(!S.authed)return;const h=location.hash.slice(1)||'/home';
  if(replacing){stack[stack.length-1]=h;replacing=false}
  else if(stack.length>1&&stack[stack.length-2]===h)stack.pop();
  else if(stack[stack.length-1]!==h)stack.push(h);
  render();
}
async function render(){
  try{window.__flush&&await window.__flush()}catch(e){}window.__flush=null;
  const h=(location.hash.slice(1)||'/home');curHash=h;
  const[path,qs]=h.split('?');const q=Object.fromEntries(new URLSearchParams(qs||''));
  const seg=path.split('/').filter(Boolean);
  const key='/'+seg[0],fn=ROUTES[key]||ROUTES['/home'];
  const el=await fn(seg.slice(1),q);if(curHash!==h)return;
  mountScreen(el);
}

const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
};
const Doctor={get(){return LS.get('ov_doctor',{name:'',qual:'',place:'',phone:''})},set(d){LS.set('ov_doctor',d)}};
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};

const Auth={
  acct:()=>LS.get('ov_acct',null),
  async hash(pw,salt){
    if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
      const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:120000,hash:'SHA-256'},k,256);
      return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
    let h=5381;const s=salt+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'x'+h;
  },
  normId:s=>{s=String(s||'').trim().toLowerCase();return /^[\d\s+\-()]+$/.test(s)?digits(s).slice(-10):s},
  genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';const r=new Uint8Array(8);(crypto.getRandomValues?crypto.getRandomValues(r):r.forEach((_,i)=>r[i]=Math.random()*256));for(let i=0;i<8;i++)c+=A[r[i]%A.length];return c.slice(0,4)+'-'+c.slice(4)},
  normCode:s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''),
  async create(name,id,pw){const salt=uid(),rsalt=uid(),code=Auth.genCode();
    LS.set('ov_acct',{name,id:Auth.normId(id),idRaw:id.trim(),salt,hash:await Auth.hash(pw,salt),rsalt,rhash:await Auth.hash(Auth.normCode(code),rsalt)});
    const d=Doctor.get();if(!d.name)Doctor.set({...d,name});return code},
  async verify(id,pw){const a=Auth.acct();if(!a||Auth.normId(id)!==a.id)return false;return(await Auth.hash(pw,a.salt))===a.hash},
  async verifyPw(pw){const a=Auth.acct();return a&&(await Auth.hash(pw,a.salt))===a.hash},
  async reset(code,pw){const a=Auth.acct();if(!a||(await Auth.hash(Auth.normCode(code),a.rsalt))!==a.rhash)return false;a.salt=uid();a.hash=await Auth.hash(pw,a.salt);LS.set('ov_acct',a);return true},
  async changePw(pw){const a=Auth.acct();a.salt=uid();a.hash=await Auth.hash(pw,a.salt);LS.set('ov_acct',a)},
  async newCode(){const a=Auth.acct(),c=Auth.genCode();a.rsalt=uid();a.rhash=await Auth.hash(Auth.normCode(c),a.rsalt);LS.set('ov_acct',a);return c},
  startSession(){try{(S.settings.askLogin?sessionStorage:localStorage).setItem('ov_session','1');(S.settings.askLogin?localStorage:sessionStorage).removeItem('ov_session')}catch(e){}},
  hasSession(){try{return(S.settings.askLogin?sessionStorage:localStorage).getItem('ov_session')==='1'}catch(e){return false}},
  endSession(){try{localStorage.removeItem('ov_session');sessionStorage.removeItem('ov_session')}catch(e){}},
};

let loginMode='login';
function showLogin(mode){
  const a=Auth.acct();loginMode=mode||(a?'login':'signup');setScreen(loginEl());
}
function loginEl(){
  const el=mk('login','');
  function draw(){
    const m=loginMode,a=Auth.acct();
    const social=`<div class="or">or</div><button class="btn sec soc" data-a="soc">${APPLE} Continue with Apple</button><button class="btn sec soc" data-a="soc">${GOOGLE} Continue with Google</button>`;
    let form='';
    if(m==='login')form=`<h2>Welcome Back</h2><p class="sub">Login to continue</p>
      <div class="fld"><div class="iwrap">${I('mail','sm')}<input class="inp" id="lid" placeholder="Email or Mobile Number" autocomplete="username" value="${esc(a?a.idRaw:'')}"></div></div>
      <div class="fld" style="margin-bottom:6px"><div class="iwrap">${I('lock','sm')}<input class="inp" id="lpw" type="password" placeholder="Password" autocomplete="current-password"><button class="eye" data-a="eye" aria-label="Show password">${I('eyeoff','sm')}</button></div></div>

      <div class="fld"><div class="iwrap">${I('user','sm')}<input class="inp" id="sname" placeholder="Your name (e.g. Dr. A. Sharma)" autocomplete="name"></div></div>
      <div class="fld"><div class="iwrap">${I('mail','sm')}<input class="inp" id="lid" placeholder="Email or Mobile Number" autocomplete="username"></div></div>
      <div class="fld" style="margin-bottom:6px"><div class="iwrap">${I('lock','sm')}<input class="inp" id="lpw" type="password" placeholder="Password (min 6 characters)" autocomplete="new-password"><button class="eye" data-a="eye" aria-label="Show password">${I('eyeoff','sm')}</button></div></div>
      <div class="help err hidden" id="lerr"></div><div style="height:12px"></div>
      <button class="btn pri" data-a="signup" style="height:54px">Create account</button>
      ${a?`<button class="lk" data-a="tologin">I already have an account</button>`:''}${social}`;
    else form=`<h2>Reset password</h2><p class="sub">Enter the recovery code you saved at sign-up</p>
      <div class="fld"><div class="iwrap">${I('key','sm')}<input class="inp" id="rcode" placeholder="XXXX-XXXX" autocapitalize="characters" autocomplete="off"></div></div>
      <div class="fld" style="margin-bottom:6px"><div class="iwrap">${I('lock','sm')}<input class="inp" id="lpw" type="password" placeholder="New password (min 6 characters)" autocomplete="new-password"><button class="eye" data-a="eye" aria-label="Show password">${I('eyeoff','sm')}</button></div></div>
      <div class="help err hidden" id="lerr"></div><div style="height:12px"></div>
      <button class="btn pri" data-a="reset" style="height:54px">Set new password</button>
      <button class="lk" data-a="tologin">Back to login</button>
      <button class="lk" style="color:var(--red);font-size:13px" data-a="wipe">Lost the code? Erase everything &amp; start over</button>`;
    el.innerHTML=`<div class="in"><div class="lg">${logo(54)}<h1>Oculo<b>Vault</b></h1></div>${form}</div>`;
  }
  const err=t=>{const x=$('#lerr',el);x.textContent=t;x.classList.remove('hidden')};
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('[data-a=login],[data-a=signup],[data-a=reset]',el);b&&b.click()}});
  el.addEventListener('click',async e=>{
    const b=e.target.closest('[data-a]');if(!b)return;const act=b.dataset.a;
    if(act==='eye'){const i=$('#lpw',el),sh=i.type==='password';i.type=sh?'text':'password';b.innerHTML=I(sh?'eye':'eyeoff','sm')}
    else if(act==='soc')toast('Apple / Google sign-in needs the cloud-sync build — use email or mobile for now');
    else if(act==='forgot'){loginMode='forgot';draw()}
    else if(act==='tologin'){loginMode='login';draw()}
    else if(act==='login'){const id=$('#lid',el).value,pw=$('#lpw',el).value;if(!id||!pw)return err('Enter your email/mobile and password');
      b.disabled=true;const ok=await Auth.verify(id,pw);b.disabled=false;if(!ok)return err('Incorrect email/mobile or password');enterApp()}
    else if(act==='signup'){const n=$('#sname',el).value.trim(),id=$('#lid',el).value.trim(),pw=$('#lpw',el).value;
      if(!n)return err('Enter your name');if(!id)return err('Enter an email or mobile number');if(pw.length<6)return err('Password needs at least 6 characters');
      b.disabled=true;const code=await Auth.create(n,id,pw);b.disabled=false;
      const sh=openSheet({title:'Save your recovery code',body:`<p style="margin:0 0 6px;color:var(--ink2)">If you forget your password, this code is the only way back in. Write it down or screenshot it.</p><div class="code">${code}</div><div class="note">Everything is stored on this device only. Use <b>More → Backup &amp; Restore</b> regularly.</div>`,footer:`<button class="btn pri" id="ok">I've saved it — continue</button>`});
      sh.el.querySelector('.ib').style.display='none';$('#ok',sh.el).onclick=()=>{sh.close();enterApp()}}
    else if(act==='reset'){const c=$('#rcode',el).value,pw=$('#lpw',el).value;if(!c)return err('Enter your recovery code');if(pw.length<6)return err('Password needs at least 6 characters');
      b.disabled=true;const ok=await Auth.reset(c,pw);b.disabled=false;if(!ok)return err('That recovery code is not correct');toast('Password updated — please log in');loginMode='login';draw()}
    else if(act==='wipe'){if(await confirmBox({title:'Erase everything?',msg:'This deletes the account and ALL patient records on this device. This cannot be undone (unless you have a backup file).',ok:'Erase all',danger:true})){await DB.clear();await loadAll();localStorage.removeItem('ov_acct');localStorage.removeItem('ov_doctor');Auth.endSession();toast('All data erased');loginMode='signup';draw()}}
  });
  draw();return el;
}
async function enterApp(){
  Auth.startSession();S.authed=true;
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  stack=[];const h=location.hash.slice(1);
  if(!h||h==='/'||/^\/(login|splash)/.test(h)){replacing=false;history.replaceState(null,'','#/home');}
  stack=[location.hash.slice(1)||'/home'];render();
}

/* ---------- shared row builders ---------- */
function ptRow(p,mod){
  const cs=casesOf(p.id),use=mod?cs.filter(c=>c.module===mod):cs;
  const dx=use.map(dxText).filter(Boolean).join(' · ')||'<i style="font-style:normal;color:var(--ink3)">Diagnosis not added</i>';
  const tid=latestThumbId(p.id,mod);
  const mods=[...new Set(cs.map(c=>c.module))];
  return `<div class="pt" role="link" tabindex="0" data-go="/patient/${p.id}">
    ${tid?`<div class="av" data-bgmid="${tid}"></div>`:`<div class="av">${esc(initials(p.name))}</div>`}
    <div class="m"><div class="n">${esc(p.name)}</div><div class="s"><b>${esc(p.regId)}</b> · ${esc(ageSex(p))}</div><div class="s">${typeof dx==='string'&&dx.startsWith('<i')?dx:esc(dx)}</div></div>
    <div class="r">${p.mobile?`<a class="callb" href="tel:${esc(p.mobile.replace(/[^\d+]/g,''))}" aria-label="Call ${esc(p.name)}">${I('phone','sm')}</a>`:''}${!mod&&mods.length?`<span class="tag navy">${mods.length>1?mods.length+' specialties':esc(MODS[mods[0]].label)}</span>`:''}</div></div>`;
}
function noteText(p){return(casesOf(p.id).map(c=>(c.history||'')+' '+(c.management||'')+' '+(c.otherDx||'')).join(' ')+' '+(p.notes||[]).map(n=>n.text).join(' ')+' '+patientDx(p.id)).toLowerCase()}
function matchPatient(p,q){q=q.trim().toLowerCase();if(!q)return true;const dq=digits(q);return p.name.toLowerCase().includes(q)||p.regId.toLowerCase().includes(q)||(dq.length>=3&&digits(p.mobile).includes(dq))||(q.length>=3&&noteText(p).includes(q))}
const byRecent=(a,b)=>(b.updated||b.created)-(a.updated||a.created);
function emptyHTML(ic,t,s,btn){return `<div class="empty"><div class="ei">${I(ic,'lg')}</div><b>${t}</b>${s}${btn?`<div style="margin-top:16px">${btn}</div>`:''}</div>`}
function reviewRow(r,{showActs=true}={}){
  const p=byId('patients',r.patientId);if(!p)return '';const st=reviewStatus(r);
  const tag=st==='overdue'?`<span class="tag red">${-dayDiff(r.date,today())}d overdue</span>`:st==='today'?`<span class="tag amber">Today</span>`:st==='done'?`<span class="tag green">Done</span>`:`<span class="tag grey">${relDay(r.date)}</span>`;
  return `<div class="frow" data-go="/patient/${p.id}?tab=followup"><div class="m"><div class="n" style="font-weight:700">${esc(p.name)}</div><div class="s" style="font-size:12.5px;color:var(--ink3)"><b style="color:var(--ink2)">${esc(p.regId)}</b>${patientDx(p.id)?' · '+esc(patientDx(p.id)):''}</div><div style="margin-top:6px;display:flex;gap:6px;align-items:center">${tag}<span style="font-size:12.5px;color:var(--ink2);font-weight:600">${fmtDate(r.date)}</span></div></div>
  ${showActs&&!r.done?`<div class="acts"><button data-log="${p.id}">${I('plus','sm')} Log visit</button><button class="dn" data-done="${r.id}">${I('check','sm')} Mark done</button></div>`:''}</div>`;
}
function bindReviewActs(root,after){
  root.addEventListener('click',async e=>{
    const l=e.target.closest('[data-log]');if(l){e.stopPropagation();go(`/patient/${l.dataset.log}?tab=followup&add=1`);return}
    const d=e.target.closest('[data-done]');if(d){e.stopPropagation();const r=byId('reviews',d.dataset.done);r.done=true;r.doneAt=Date.now();await save('reviews',r);toast('Marked as done');after&&after()}
  },true);
}

    $('#flt',el).innerHTML=['all',...MODKEYS].map(k=>`<button class="chip ${PL.f===k?'on':''}" data-f="${k}">${k==='all'?'All':MODS[k].label}</button>`).join('');
    const list=S.patients.filter(p=>matchPatient(p,PL.q)&&(PL.f==='all'||casesOf(p.id).some(c=>c.module===PL.f))).sort(byRecent);
    $('#list',el).innerHTML=list.length?list.map(p=>ptRow(p,PL.f==='all'?null:PL.f)).join(''):emptyHTML(PL.q?'search':'users',PL.q?'No match':'No patients yet',PL.q?'Try a different name, ID or number.':'Add your first patient to get started.',PL.q?'':`<button class="btn pri sm" data-go="/add">${I('plus','sm')} Add Patient</button>`);

  const el=mk('',`<div class="top"><button class="ib" data-back="/home">${I('back')}</button><h1>${M.label}</h1><span style="width:42px"></span></div>
   <div class="scroll"><div class="spec ${M.cls}" style="cursor:default"><div class="si">${I(M.icon)}</div><div class="sm"><b>${M.label.toUpperCase()}</b><span>${M.sub}</span></div><div class="sc"><b>${total}</b><span>patients</span></div></div>

/* ---------- Case form (diagnosis chips) ---------- */
function caseFormHTML(mod,c={}){
  const M=MODS[mod],dx=c.diagnoses||[],inv=c.inv||[];
  return `<div class="cf" data-mod="${mod}">
   <div class="fld"><label>Diagnosis <span style="font-weight:500;color:var(--ink3)">· tap to select, multiple allowed</span></label>
    <div class="chips" data-g="dx">${M.dx.map(d=>`<button type="button" class="chip" data-v="${esc(d)}" aria-pressed="${dx.includes(d)}">${esc(d)}</button>`).join('')}</div>
    <input class="inp ${dx.includes('Other')?'':'hidden'}" data-other placeholder="Specify other diagnosis" value="${esc(c.otherDx||'')}" style="margin-top:10px"></div>
   <div class="fld"><label>Eye involved</label><div class="chips seg" data-g="side">${['OD','OS','OU'].map(s=>`<button type="button" class="chip" data-v="${s}" aria-pressed="${c.side===s}">${s}</button>`).join('')}</div><div class="help">OD right · OS left · OU both</div></div>
   ${M.inv.length?`<div class="fld"><label>Investigations</label><div class="chips" data-g="inv">${M.inv.map(d=>`<button type="button" class="chip" data-v="${esc(d)}" aria-pressed="${inv.includes(d)}">${esc(d)}</button>`).join('')}</div></div>`:''}</div>`;
}
function bindCaseForm(root){
  root.addEventListener('click',e=>{const b=e.target.closest('.cf .chip');if(!b)return;const grp=b.parentElement,g=grp.dataset.g,on=b.getAttribute('aria-pressed')==='true';
    if(g==='side')$$('.chip',grp).forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed',on?'false':'true');
    if(g==='dx'){const cf=b.closest('.cf'),other=$('[data-other]',cf),has=$('[data-v="Other"]',grp).getAttribute('aria-pressed')==='true';other.classList.toggle('hidden',!has);if(has&&b.dataset.v==='Other')other.focus()}});
}
function readCaseForm(cf){
  const sel=g=>$$(`[data-g="${g}"] .chip[aria-pressed="true"]`,cf).map(x=>x.dataset.v);
  const dx=sel('dx');return{diagnoses:dx,otherDx:dx.includes('Other')?$('[data-other]',cf).value.trim():'',side:sel('side')[0]||'',inv:sel('inv')};
}

async function storeImages(files,{patientId,module,category,date,desc,visitId},onProg){
  let n=0,ok=0;
  for(const f of files){onProg&&onProg(++n);
    try{const{full,thumb}=await processImage(f);const id=uid();await DB.put('blobs',{id,blob:full});
      await save('media',{id,patientId,module:module||null,category,date,desc:desc||'',visitId:visitId||null,created:Date.now()+n,thumb,size:full.size});ok++}catch(e){console.error(e)}}
  return ok;
}
function catsFor(pid){
  const s=new Set();casesOf(pid).forEach(c=>MODS[c.module].cats.forEach(x=>s.add(x)));mediaOf(pid).forEach(m=>s.add(m.category));
  if(!s.size)['preop','postop','followup','ct','mri','other'].forEach(x=>s.add(x));
  return CATORDER.filter(x=>s.has(x));
}
async function deletePatient(p){
  const pid=p.id;for(const m of mediaOf(pid))await remove('media',m.id);
  for(const x of casesOf(pid))await remove('cases',x.id);for(const x of visitsOf(pid))await remove('visits',x.id);for(const x of reviewsOf(pid))await remove('reviews',x.id);
  await remove('patients',pid);
}

/* ---------- file helpers ---------- */
function deliverFile(blob,name){
  const f=new File([blob],name,{type:blob.type}),mobile=/Android|iPhone|iPad/i.test(navigator.userAgent);
  const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('Saved '+name);return true};
  if(mobile&&navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:name}).then(()=>true).catch(e=>e.name==='AbortError'?false:dl());
  return Promise.resolve(dl());
}
function pickAnyFile(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.style.display='none';i.onchange=()=>{const f=i.files[0];i.remove();res(f||null)};document.body.appendChild(i);i.click()})}
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});

/* ---------- backup ---------- */
async function makeBackup(withImages=true){
  const media=withImages?S.media.map(({thumb,...m})=>m):[];
  const parts=['{"app":"OculoVault","version":2,"build":'+JSON.stringify(BUILD)+',"exported":'+JSON.stringify(new Date().toISOString())+',"withImages":'+withImages+',"doctor":'+JSON.stringify(Doctor.get())+',"data":'+JSON.stringify({patients:S.patients,cases:S.cases,visits:S.visits,reviews:S.reviews,media})+',"images":{'];
  if(withImages){let first=true;for(const m of S.media){const b=await DB.get('blobs',m.id);if(!b)continue;parts.push((first?'':',')+JSON.stringify(m.id)+':'+JSON.stringify(await blobToDataURL(b.blob)));first=false}}
  parts.push('}}');return new Blob(parts,{type:'application/json'});
}
async function applyBackup(j,mode){
  if(mode==='replace'){await DB.clear();await loadAll()}
  let np=0,kept=0;
  for(const o of j.data.patients||[]){const l=byId('patients',o.id);if(l&&(l.updated||0)>(o.updated||0)){kept++;continue}await save('patients',o);np++}
  for(const k of['cases','visits','reviews'])for(const o of j.data[k]||[])await save(k,o);
  let nm=0;for(const m of j.data.media||[]){const d=j.images&&j.images[m.id];if(!d)continue;
    const blob=await(await fetch(d)).blob(),bm=await loadBitmap(blob),thumb=await renderScaled(bm,360,.8);bm.close&&bm.close();
    await DB.put('blobs',{id:m.id,blob});await save('media',{...m,thumb});nm++}
  if(j.doctor&&!Doctor.get().name)Doctor.set(j.doctor);
  return{np,nm,kept};
}

/* ---------- CSV import (smart column detection) ---------- */
function parseCSV(t){
  t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'';
  const del=[',',';','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===del){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
const CSV_SYN={regId:['regid','registrationid','registrationno','registrationnumber','reg','regno','uhid','mrn','hospitalid','patientid','crno','opdno','ipno','id'],
  name:['name','patientname','fullname'],age:['age','ageyears','ageyrs'],dob:['dob','dateofbirth','birthdate'],sex:['sex','gender'],
  mobile:['mobile','mobileno','mobilenumber','phone','phoneno','phonenumber','contact','contactno','whatsapp'],
  specialty:['specialty','speciality','module','department','unit'],diagnosis:['diagnosis','dx','diagnoses'],eye:['eye','side','laterality','eyeinvolved'],
  history:['history','complaints','presentingcomplaint','chiefcomplaint'],management:['management','plan','treatment']};
const CSV_LABEL={regId:'Reg. ID',name:'Name',age:'Age',dob:'DOB',sex:'Sex',mobile:'Mobile',specialty:'Specialty',diagnosis:'Diagnosis',eye:'Eye',history:'History',management:'Management'};
function matchDxText(txt){
  const out=[],rest=[];
  String(txt||'').split(/[;|,\/\n]+/).map(x=>x.trim()).filter(Boolean).forEach(tok=>{const t=tok.toLowerCase();let hit=null;
    for(const k of MODKEYS)for(const d of MODS[k].dx){if(d==='Other')continue;const dl=d.toLowerCase();if(dl===t){hit={m:k,d};break}}
    if(!hit&&t.length>=4)for(const k of MODKEYS){for(const d of MODS[k].dx){if(d==='Other')continue;const dl=d.toLowerCase();if(t.includes(dl)||dl.includes(t)){hit={m:k,d};break}}if(hit)break}
    hit?out.push(hit):rest.push(tok)});
  return{hits:out,rest};
}
function modFromText(t){t=String(t||'').toLowerCase();const m=[];if(/oculo|plast|lid|lacrim|orbit/.test(t))m.push('oculoplasty');if(/squint|strab|motil/.test(t))m.push('squint');if(/trauma|injur/.test(t))m.push('trauma');return m}
function buildImport(rows){
  const hdr=rows[0].map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,'')),idx={};
  Object.keys(CSV_SYN).forEach(f=>{const i=hdr.findIndex(h=>CSV_SYN[f].includes(h));if(i>=0)idx[f]=i});
  if(idx.regId==null||idx.name==null)return{error:`Could not find ${idx.regId==null?'a Registration ID':'a Name'} column. Expected headers like “Reg ID”, “Name”, “Age”, “Sex”, “Mobile”.`};
  const get=(r,f)=>idx[f]!=null?String(r[idx[f]]||'').trim():'';
  const recs=[];let skipped=0;
  rows.slice(1).forEach(r=>{const regId=get(r,'regId'),name=get(r,'name');if(!regId||!name){skipped++;return}
    let sx=get(r,'sex').toLowerCase();sx=!sx?'':/^m/.test(sx)?'Male':/^f/.test(sx)?'Female':'Other';
    const at=get(r,'age'),am=n=>{const x=at.match(new RegExp('(\\d+)\\s*'+n,'i'));return x?x[1]:''},ay=am('y'),amo=am('m'),ad=am('d'),age=(ay||amo||ad)?'':(at.match(/\d+/)||[''])[0],dm=get(r,'dob').match(/^(\d{4})-(\d{2})-(\d{2})$/),dob=dm?get(r,'dob'):'';
    const eyeT=get(r,'eye').toLowerCase(),side=/^(od|right|re|r)$/.test(eyeT)?'OD':/^(os|left|le|l)$/.test(eyeT)?'OS':/^(ou|both|bilateral|bl)$/.test(eyeT)?'OU':'';
    const dx=matchDxText(get(r,'diagnosis')),explicit=modFromText(get(r,'specialty'));
    const mods=explicit.length?explicit:[...new Set(dx.hits.map(h=>h.m))];
    const cases=mods.map((m,i)=>{const mine=dx.hits.filter(h=>h.m===m).map(h=>h.d),other=i===0&&dx.rest.length?dx.rest.join('; '):'';
      return{module:m,diagnoses:other?[...mine,'Other']:mine,otherDx:other,side,inv:[],history:get(r,'history'),management:get(r,'management')}});
    recs.push({regId,name,sex:sx,age,ageY:ay,ageM:amo,ageD:ad,ageAt:(ay||amo||ad)?today():'',dob,mobile:get(r,'mobile'),cases});
  });
  return{idx,recs,skipped};
}
async function importCSVFlow(){
  const f=await pickAnyFile('.csv,text/csv,text/plain,.txt');if(!f)return;
  const rows=parseCSV(await f.text());if(rows.length<2){toast('That file looks empty');return}
  const b=buildImport(rows);if(b.error){openSheet({title:'Cannot import',body:`<div class="note">${esc(b.error)}</div><p class="help">Tip: export a CSV from OculoVault to see the expected format.</p>`});return}
  const norm=x=>x.toLowerCase().replace(/\s+/g,''),have=new Map(S.patients.map(p=>[norm(p.regId),p]));
  const seen=new Set(),fresh=[],dups=[];b.recs.forEach(r=>{const k=norm(r.regId);if(seen.has(k))return;seen.add(k);(have.has(k)?dups:fresh).push(r)});
  const sh=openSheet({title:'Import patients',body:`<div class="note info"><b>${fresh.length}</b> new · <b>${dups.length}</b> already registered${b.skipped?` · ${b.skipped} rows skipped (missing name or ID)`:''}</div>
    <div class="lbl">Columns detected</div><div class="chips" style="gap:6px;margin-bottom:14px">${Object.keys(b.idx).map(k=>`<span class="tag">${CSV_LABEL[k]}</span>`).join('')}</div>
    ${fresh.slice(0,3).map(r=>`<div class="kv"><span>${esc(r.regId)}</span><b>${esc(r.name)}${r.cases.length?' · '+r.cases.map(c=>MODS[c.module].label).join(' + '):''}</b></div>`).join('')}
    ${dups.length?`<label style="display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:600"><input type="checkbox" id="upd" style="width:20px;height:20px"> Also update the ${dups.length} existing patients (fills in missing details, adds missing specialty)</label>`:''}`,
    footer:`<button class="btn pri" id="go" ${fresh.length||dups.length?'':'disabled'}>${I('ul','sm')} Import</button>`});
  sh.el.addEventListener('click',async e=>{if(!e.target.closest('#go'))return;const upd=$('#upd',sh.el)?.checked;sh.close();toast('Importing…');
    const mkCase=(p,c)=>save('cases',{id:uid(),patientId:p.id,...c,notes:undefined,created:Date.now(),visitDate:today()});
    let n=0,u=0;
    for(const r of fresh){const p=await save('patients',{id:uid(),name:r.name,regId:r.regId,sex:r.sex,mobile:r.mobile,age:r.age,ageY:r.ageY,ageM:r.ageM,ageD:r.ageD,ageAt:r.ageAt,dob:r.dob,created:Date.now()+n,updated:Date.now()+n});for(const c of r.cases)await mkCase(p,c);n++}
    if(upd)for(const r of dups){const p=have.get(norm(r.regId));let ch=false;
      for(const[k,v]of Object.entries({sex:r.sex,mobile:r.mobile,age:r.age,dob:r.dob}))if(v&&!p[k]){p[k]=v;ch=true}
      for(const c of r.cases)if(!casesOf(p.id).some(x=>x.module===c.module)){await mkCase(p,c);ch=true}
      if(ch){p.updated=Date.now();await save('patients',p);u++}}
    toast(`Imported ${n} new${upd?` · updated ${u}`:''}`);render()});
}

/* ---------- share patient summary ---------- */
function sharePatientSummary(p){
  const L=[`PATIENT SUMMARY — ${p.name}`,`${ageSex(p)} · Reg. ID ${p.regId}${p.mobile?' · '+p.mobile:''}`,''];
  casesOf(p.id).forEach(c=>{L.push(`${MODS[c.module].label.toUpperCase()}: ${dxText(c)||'diagnosis not recorded'}`);if((c.inv||[]).length)L.push('Investigations: '+c.inv.join(', '));if(c.history)L.push('History: '+c.history.replace(/\n+/g,'; '));if(c.management)L.push('Management: '+c.management.replace(/\n+/g,'; '));L.push('')});
  const vs=visitsOf(p.id).slice(0,5);if(vs.length){L.push('RECENT FOLLOW-UPS');vs.forEach(v=>L.push(`• ${fmtDate(v.date)}${v.notes?' — '+v.notes.replace(/\n+/g,'; '):''}`));L.push('')}
  const pr=pendingReview(p.id);if(pr)L.push('Next review: '+fmtDate(pr.date));
  const ns=(p.notes||[]);if(ns.length){L.push('','NOTES');ns.slice(-5).forEach(n=>L.push(`• ${fmtDate(n.date)} — ${n.text.replace(/\n+/g,'; ')}`))}
  L.push('',`Shared from OculoVault · ${fmtDate(today())}`);const text=L.join('\n').replace(/\n{3,}/g,'\n\n');
  if(navigator.share)navigator.share({title:'Patient summary',text}).catch(()=>{});
  else(navigator.clipboard?navigator.clipboard.writeText(text).then(()=>toast('Summary copied')):Promise.reject()).catch(()=>toast('Could not copy'));
}

    x.fillStyle='#8c969e';x.font='bold 20px sans-serif';x.fillText(o.label||'AXIAL CT',20,34);
  }else{
    const tone=o.tone||['#E9C3A6','#D9A982'];const g=x.createLinearGradient(0,0,640,480);g.addColorStop(0,tone[0]);g.addColorStop(1,tone[1]);x.fillStyle=g;x.fillRect(0,0,640,480);
    x.strokeStyle='#4a2f22';x.lineCap='round';x.lineWidth=22;x.beginPath();x.moveTo(100,120);x.quadraticCurveTo(320,40,540,110);x.stroke();
    const lid=o.lid??0,ex=(o.gx||0)*60,ey=(o.gy||0)*34;
    x.save();x.beginPath();x.moveTo(90,265);x.quadraticCurveTo(320,70+lid*2,550,265);x.quadraticCurveTo(320,430,90,265);x.closePath();x.clip();
    x.fillStyle=o.red?'#d9777a':'#f6f1ec';x.fillRect(0,0,640,480);
    if(o.red){x.strokeStyle='#b8242c';x.lineWidth=3;for(let i=0;i<14;i++){x.beginPath();x.moveTo(120+i*30,270);x.quadraticCurveTo(200+i*20,250+i*3,320+(i-7)*14,265);x.stroke()}}
    const ig=x.createRadialGradient(320+ex,265+ey,8,320+ex,265+ey,92);ig.addColorStop(0,'#2a1a10');ig.addColorStop(.35,'#6b4423');ig.addColorStop(1,'#3a2414');x.fillStyle=ig;x.beginPath();x.arc(320+ex,265+ey,92,0,7);x.fill();
    x.fillStyle='#050505';x.beginPath();x.arc(320+ex,265+ey,38,0,7);x.fill();x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(296+ex,240+ey,13,0,7);x.fill();
    if(o.blood){x.fillStyle='rgba(190,20,30,.75)';x.fillRect(220+ex,300+ey,200,100)}
    if(lid){x.fillStyle=tone[0];x.beginPath();x.moveTo(60,0);x.lineTo(600,0);x.lineTo(600,150+lid);x.quadraticCurveTo(320,110+lid*1.6,60,150+lid);x.fill()}
    x.restore();
    x.strokeStyle='#5a3a2a';x.lineWidth=7;x.beginPath();x.moveTo(90,265);x.quadraticCurveTo(320,70+lid*2,550,265);x.stroke();x.lineWidth=4;x.beginPath();x.moveTo(90,265);x.quadraticCurveTo(320,430,550,265);x.stroke();
    if(o.bruise){x.fillStyle='rgba(88,40,110,.35)';x.beginPath();x.ellipse(320,170,230,60,0,0,7);x.fill()}
    if(o.suture){x.strokeStyle='#1a1a1a';x.lineWidth=3;for(let i=0;i<7;i++){x.beginPath();x.moveTo(230+i*22,150);x.lineTo(238+i*22,190);x.stroke()}}
  }
  return new Promise(r=>c.toBlob(r,'image/jpeg',.85));
}
